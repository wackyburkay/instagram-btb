name: Release

# Push a tag matching manifest.json's version (e.g. v0.1.0) to publish a release
# with the packaged extension attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          version="v$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Package extension
        run: |
          mkdir dist
          name="instagram-btb-$GITHUB_REF_NAME"
          git archive --format=zip -o "dist/$name.zip" HEAD manifest.json src popup
          # Firefox-based browsers install .xpi files; it's the same zip.
          cp "dist/$name.zip" "dist/$name.xpi"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
